apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: praetorium-static-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: praetorium
spec:
  suspend: true
  interval: 10m
  path: ./infrastructure/kubernetes/overlays/deployment
  prune: true
  dependsOn:
    - name: praetorium-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
