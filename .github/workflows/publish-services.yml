name: Publish Praetorium service images

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main commit to verify and publish
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # PR/main checks are superseded. Explicit release/tag runs have unique,
  # immutable groups and cannot cancel a release still publishing to GHCR.
  group: praetorium-oci-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Install and verify monorepo
        run: |
          corepack enable
          corepack pnpm@11.18.0 install --frozen-lockfile
          corepack pnpm@11.18.0 check
          node --test tests/deployment/reproducibility.test.mjs
          node --test tests/deployment/headlamp-admin.test.mjs
          node scripts/ci/verify-workerd-runtime-identity.mjs

  candidate-images:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: provisioner
            package: '@praetorium/provisioner'
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: instance-access
            package: '@praetorium/instance-access'
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: build-worker
            package: '@praetorium/build-worker'
            dockerfile: infrastructure/docker/build-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build real service image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: praetorium-ci/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=service-${{ matrix.service }}
          cache-to: type=gha,scope=service-${{ matrix.service }},mode=max
          build-args: |
            NODE_BUILD_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            NODE_RUNTIME_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            BUILDKIT_CLIENT_IMAGE=docker.io/moby/buildkit@sha256:c1d0a1bc930a427f99f72220d1b263d6986d4592b21507fbc7f8bf7ecdaed004
            BUILDKIT_CLIENT_BUILDCTL_PATH=/usr/bin/buildctl
            PRAETORIUM_BUILDKIT_BUILDCTL_PATH=/usr/local/bin/buildctl
            SERVICE_PACKAGE=${{ matrix.package }}
      - name: Assert image exists locally
        run: docker image inspect "praetorium-ci/${{ matrix.service }}:${{ github.sha }}" >/dev/null

  kubernetes-admission:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Build real tenant resource renderer
        run: |
          corepack enable
          corepack pnpm@11.18.0 install --frozen-lockfile
          corepack pnpm@11.18.0 --filter '@praetorium/kubernetes...' build
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: praetorium-ci
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Validate dynamic Runtime objects against the disposable Kubernetes API
        run: |
          node scripts/ci/render-runtime-admission.mjs > /tmp/praetorium-runtime.json
          RUNTIME_NAMESPACE=$(node -e 'const x=require("/tmp/praetorium-runtime.json"); const names=[...new Set(x.items.map(v=>v.metadata.namespace))]; if(names.length!==1 || !/^praetorium-ci-[a-z0-9-]+$/.test(names[0]))process.exit(1); console.log(names[0]);')
          kubectl create namespace "$RUNTIME_NAMESPACE"
          kubectl label namespace "$RUNTIME_NAMESPACE" \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/warn=restricted \
            --overwrite
          kubectl apply --dry-run=server --validate=strict -f /tmp/praetorium-runtime.json
      - name: Render and validate the exact Headlamp HelmRelease values
        run: |
          helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
          awk '/^  values:/{v=1;next} v{sub(/^    /,"");print}' \
            infrastructure/kubernetes/addons/headlamp/helm-release.yaml > /tmp/headlamp-values.yaml
          helm template praetorium-headlamp headlamp/headlamp \
            --version 0.45.0 --namespace praetorium-admin \
            --values /tmp/headlamp-values.yaml > /tmp/headlamp.yaml
          kubectl create namespace praetorium-admin
          kubectl apply --dry-run=server --validate=strict -f /tmp/headlamp.yaml

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: provisioner
            package: '@praetorium/provisioner'
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: instance-access
            package: '@praetorium/instance-access'
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: build-worker
            package: '@praetorium/build-worker'
            dockerfile: infrastructure/docker/build-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Select immutable publication reference
        id: publication
        env:
          TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ && "$EXPECTED_REVISION" == "$GITHUB_SHA" ]] ||
              { echo "Requested revision differs from the checked-out main commit" >&2; exit 1; }
            echo "tag=source-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
              { echo "Invalid semver tag" >&2; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish pinned service
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: |
            ghcr.io/yohn-jp/praetorium/${{ matrix.service }}:${{ steps.publication.outputs.tag }}
          build-args: |
            NODE_BUILD_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            NODE_RUNTIME_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            BUILDKIT_CLIENT_IMAGE=docker.io/moby/buildkit@sha256:c1d0a1bc930a427f99f72220d1b263d6986d4592b21507fbc7f8bf7ecdaed004
            BUILDKIT_CLIENT_BUILDCTL_PATH=/usr/bin/buildctl
            PRAETORIUM_BUILDKIT_BUILDCTL_PATH=/usr/local/bin/buildctl
            SERVICE_PACKAGE=${{ matrix.package }}
      - name: Record digest for deployment inventory
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "ghcr.io/yohn-jp/praetorium/$SERVICE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
