---
- name: Validate the Management role boundary
  ansible.builtin.assert:
    that:
      - praetorium_host_role == 'management'
    fail_msg: "The Coordination Plane may only run on a Management host."

- name: Install the rootless Coordination Plane and private connector
  ansible.builtin.include_tasks: install.yml
  when: coordination_enabled | bool
