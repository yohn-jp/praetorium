name = "praetorium-control-plane"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Preserve existing remote policy variables not yet declared in this config.
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[[services]]
binding = "GATEWAY_SERVICE"
service = "praetorium-gateway"

[[d1_databases]]
binding = "CONTROL_PLANE_DB"
database_name = "praetorium-platform"
database_id = "08f29fef-eb9e-4541-82fb-777fa2f4aab0"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "REPOSITORY_COORDINATOR"
class_name = "RepositoryCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepositoryCoordinator"]

[[routes]]
pattern = "control.praetorium.yohn.jp"
custom_domain = true

[vars]
GATEWAY_ORIGIN = "https://praetorium.yohn.jp"
CONTROL_PLANE_ORIGIN = "https://control.praetorium.yohn.jp"
INSTANCE_HOST_SUFFIX = "instances.praetorium.yohn.jp"
PROVISIONER_CLUSTER_ID = "clu_01M552J5HCXXJAPCCPN480JSJN"
PROVISIONER_WORKER_ID = "clu_01M552J5HCXXJAPCCPN480JSJN-provisioner"
BUILD_WORKER_ID = "clu_01M552J5HCXXJAPCCPN480JSJN-build-worker"
RUNTIME_REGISTRY_HOST = "ghcr.io"
GIT_CREDENTIAL_BROKER_LOCATOR = "https://praetorium.yohn.jp/internal/github/credential"

# Public initial builder trust and approved OCI repositories; no private key or credentials.
BUILD_POLICY_JSON = "{\"registryUrl\":\"https://ghcr.io\",\"allowedRepositories\":[\"yohn-jp/praetorium/candidates\",\"yohn-jp/praetorium/scriptorium-producer\",\"yohn-jp/praetorium/compositions\"],\"outputRepository\":\"yohn-jp/praetorium/candidates\",\"maxImageLayerBytes\":17179869184,\"maxImageVerificationMs\":120000,\"maxRegistryRequestMs\":60000,\"runtimeResourceLimits\":{\"cpuMilli\":2000,\"memoryMiB\":4096,\"ephemeralStorageMiB\":8192},\"cacheRetention\":{\"maxBytes\":1048576,\"maxEntries\":32,\"minAgeMs\":0,\"maxEvictions\":8},\"targetPlatform\":\"linux/amd64\",\"builderKeys\":[{\"keyId\":\"builder-key-v1\",\"publicKeyBase64\":\"KFpHfh5VIGUeS40Zq39CtU5q7OK5lLBTdiMYVOCftMo=\",\"revoked\":false}]}"
