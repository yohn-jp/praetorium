apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: praetorium-provisioner-bootstrap
  labels:
    app.kubernetes.io/part-of: praetorium
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas", "serviceaccounts", "services"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["praetorium-provisioner-runtime"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["praetorium-provisioner-tenant-runtime"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: praetorium-provisioner-tenant-runtime
  labels:
    app.kubernetes.io/part-of: praetorium
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas", "secrets", "serviceaccounts", "services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: praetorium-provisioner-bootstrap
  labels:
    app.kubernetes.io/part-of: praetorium
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: praetorium-provisioner-bootstrap
subjects:
  - kind: ServiceAccount
    name: praetorium-provisioner
    namespace: praetorium-system
