name: Publish signed Scriptorium producer inputs (reusable)

on:
  workflow_call:
    inputs:
      producer_run_id:
        required: true
        type: string
      scriptorium_revision:
        required: true
        type: string
      source_tag:
        required: false
        type: string
      release_version:
        required: false
        type: string
      admit_release:
        required: false
        default: false
        type: boolean
      producer_run_attempt:
        required: true
        type: string
      metadata_artifact_name:
        required: true
        type: string
      signed_artifact_name:
        required: true
        type: string
      public_inputs_artifact_name:
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: true
      RELEASE_OPERATOR_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      SCRIPTORIUM_REVISION: ${{ inputs.scriptorium_revision }}
      SCRIPTORIUM_TAG: ${{ inputs.source_tag }}
      SCRIPTORIUM_RELEASE_VERSION: ${{ inputs.release_version }}
      IMAGE_REPOSITORY: ghcr.io/yohn-jp/praetorium/scriptorium-producer
      SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:8342e1e8d7b12d0bd3bf53ce8f4fde7ed876277aa8e4345f53937a505309e6b5
      PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      PRODUCER_BUILD_ATTEMPT: ${{ inputs.producer_run_attempt }}
    steps:
      - name: Check out trusted Praetorium publication validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: praetorium
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Fetch exact pinned Scriptorium source as inert validator input
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/scriptorium"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/yohn-jp/scriptorium.git
          if [ -n "$SCRIPTORIUM_TAG" ] && [ -n "$SCRIPTORIUM_RELEASE_VERSION" ]; then
            bash "$GITHUB_WORKSPACE/praetorium/scripts/ci/checkout-selected-release.sh" "$source_dir"
          else
            [[ "$SCRIPTORIUM_REVISION" =~ ^[0-9a-f]{40}$ ]]
            git -C "$source_dir" fetch --depth=1 origin "$SCRIPTORIUM_REVISION"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = "$SCRIPTORIUM_REVISION"
          fi
          test -z "$(git -C "$source_dir" status --porcelain)"
          test "$(git -C "$source_dir" remote get-url origin)" = "https://github.com/yohn-jp/scriptorium.git"

      - name: Download exact producer metadata from its original run attempt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.metadata_artifact_name }}
          path: ${{ runner.temp }}/scriptorium-producer-metadata
          run-id: ${{ inputs.producer_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download exact successful signer bundle from its original run attempt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.signed_artifact_name }}
          path: ${{ runner.temp }}/scriptorium-producer-signed-metadata
          run-id: ${{ inputs.producer_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download only the original two public OCI input archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.public_inputs_artifact_name }}
          path: ${{ runner.temp }}/scriptorium-producer-public-inputs
          run-id: ${{ inputs.producer_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Revalidate exact metadata and producer source without executing producer code
        shell: bash
        env:
          SCRIPTORIUM_ROOT: ${{ github.workspace }}/scriptorium
          PRODUCER_METADATA_DIR: ${{ runner.temp }}/scriptorium-producer-metadata
          PUBLISH_PUBLIC_PRODUCER_IMAGES: "true"
        run: node "$GITHUB_WORKSPACE/praetorium/scripts/ci/validate-producer-attestation.mjs"

      - name: Download and verify pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          cosign="$RUNNER_TEMP/cosign"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            --output "$cosign"
          printf '%s  %s\n' 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 "$cosign" | sha256sum --check
          chmod 0755 "$cosign"
          "$cosign" version | grep -F 'v3.1.3'

      - name: Verify the original successful signer bundle and workflow identity
        shell: bash
        env:
          COSIGN_IDENTITY: https://github.com/yohn-jp/praetorium/.github/workflows/scriptorium-producer-verification.yml@refs/heads/main
          COSIGN_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" verify-blob-attestation --new-bundle-format=true \
            --bundle "$RUNNER_TEMP/scriptorium-producer-signed-metadata/provenance.sigstore.json" \
            --type https://slsa.dev/provenance/v1 \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            "$RUNNER_TEMP/scriptorium-producer-metadata/build-catalog.json"

      - name: Verify pinned Skopeo image
        shell: bash
        env:
          CONTAINER_RUNTIME: docker
        run: bash "$GITHUB_WORKSPACE/praetorium/scripts/ci/verify-pinned-skopeo.sh"

      - name: Publish the original signed producer inputs with digest preservation
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_AUTH_DIR: ${{ runner.temp }}/ghcr-auth
          PRODUCER_METADATA_DIR: ${{ runner.temp }}/scriptorium-producer-metadata
          PRODUCER_SIGNED_METADATA_DIR: ${{ runner.temp }}/scriptorium-producer-signed-metadata
          PRODUCER_PUBLIC_INPUTS_DIR: ${{ runner.temp }}/scriptorium-producer-public-inputs
          PUBLICATION_SUMMARY: ${{ runner.temp }}/producer-publication-summary.json
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$GHCR_AUTH_DIR"
          trap 'rm -rf "$GHCR_AUTH_DIR"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$GHCR_AUTH_DIR" login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          chmod 600 "$GHCR_AUTH_DIR/config.json"
          unset GHCR_TOKEN GHCR_USERNAME
          set +e
          node "$GITHUB_WORKSPACE/praetorium/scripts/ci/publish-producer-inputs.mjs"
          publish_status=$?
          set -e
          if [ -f "$PUBLICATION_SUMMARY" ]; then
            cat "$PUBLICATION_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'PUBLIC_AVAILABILITY_BLOCKED: publisher failed before writing its readback summary (exit %s).\n' \
              "$publish_status" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$publish_status"

      - name: Publish signed producer bundle and request canonical Operator Admission
        if: inputs.admit_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_OPERATOR_TOKEN: ${{ secrets.RELEASE_OPERATOR_TOKEN }}
          PRODUCER_METADATA_DIR: ${{ runner.temp }}/scriptorium-producer-metadata
          PRODUCER_RELEASE_MANIFEST_FILE: ${{ runner.temp }}/release-admission-manifest.json
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = "yohn-jp/praetorium"
          [[ "$SCRIPTORIUM_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$PRODUCER_BUILD_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
          test -n "$RELEASE_OPERATOR_TOKEN" || {
            echo "PRAETORIUM_RELEASE_OPERATOR_TOKEN Actions secret must be provisioned before automatic release admission" >&2
            exit 1
          }
          test -n "$SCRIPTORIUM_TAG"
          test -n "$SCRIPTORIUM_RELEASE_VERSION"
          bundle="$RUNNER_TEMP/scriptorium-producer-signed-metadata/provenance.sigstore.json"
          test -s "$bundle"
          evidence_tag="producer-evidence-$PRODUCER_RUN_ID-$PRODUCER_BUILD_ATTEMPT"
          # The bundle is exact byte-for-byte signer evidence, not a derived
          # metadata blob. A unique immutable Release asset makes it anonymously
          # retrievable by Control Plane's existing Sigstore verifier.
          gh release create "$evidence_tag" "$bundle" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Signed Producer Evidence $PRODUCER_RUN_ID/$PRODUCER_BUILD_ATTEMPT" \
            --notes "Immutable Scriptorium producer attestation: $SCRIPTORIUM_TAG ($SCRIPTORIUM_REVISION)"
          bundle_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$evidence_tag/provenance.sigstore.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 7 --retry-delay 2 --retry-all-errors \
            --max-filesize 2097152 "$bundle_url" \
            --output "$RUNNER_TEMP/public-provenance-bundle.json"
          cmp -s "$bundle" "$RUNNER_TEMP/public-provenance-bundle.json" || {
            echo "Public release attestation does not match the signed bundle" >&2
            exit 1
          }
          export PRODUCER_EVIDENCE_TAG="$evidence_tag"
          node "$GITHUB_WORKSPACE/praetorium/scripts/ci/admit-produced-release.mjs"
          # Admit as candidate only. A verified Canary and Control Plane Stable
          # promotion must complete asynchronously; this job cannot bypass them.
          status="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 2 --retry-delay 2 \
            --header "Authorization: Bearer $RELEASE_OPERATOR_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$PRODUCER_RELEASE_MANIFEST_FILE" \
            --output "$RUNNER_TEMP/operator-admission-response.json" \
            --write-out '%{http_code}' \
            "https://control.praetorium.yohn.jp/v1/operator/releases")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            printf 'Operator Admission rejected the candidate (HTTP %s). Stable was not changed.\n' "$status" >&2
            exit 1
          fi
          {
            printf '### Canonical release admission\n'
            printf 'GitHub Release: %s (%s)\n' "$SCRIPTORIUM_TAG" "$SCRIPTORIUM_REVISION"
            printf 'Signed public evidence: %s\n' "$bundle_url"
            printf 'Operator Admission accepted a candidate; waiting on Canary and Stable promotion.\n'
          } >> "$GITHUB_STEP_SUMMARY"
