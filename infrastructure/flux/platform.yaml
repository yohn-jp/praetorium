# Production static platform resources are rendered from the deployment inventory
# and applied by scripts/deploy-k3s.mjs. Keep this alternate Flux path inert so
# it cannot become a second owner or prune resources applied by the deploy CLI.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: praetorium-static-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: praetorium
spec:
  suspend: true
  interval: 10m
  path: ./infrastructure/kubernetes/overlays/deployment
  prune: false
  dependsOn:
    - name: praetorium-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
