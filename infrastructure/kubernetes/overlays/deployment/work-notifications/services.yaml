apiVersion: v1
kind: Service
metadata:
  name: praetorium-build-worker-notification
  namespace: praetorium-build
  labels:
    app.kubernetes.io/name: build-worker
    app.kubernetes.io/part-of: praetorium
spec:
  type: ClusterIP
  ports:
    - name: work-notify
      port: 8788
      targetPort: work-notify
      protocol: TCP
  selector:
    app.kubernetes.io/name: build-worker
