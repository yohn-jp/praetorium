apiVersion: apps/v1
kind: Deployment
metadata:
  name: praetorium-provisioner
  namespace: praetorium-system
spec:
  template:
    spec:
      containers:
        - name: provisioner
          env:
            - name: PROVISIONER_WORK_NOTIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "@@PROVISIONER_WORK_NOTIFICATION_TOKEN_SECRET@@"
                  key: "@@PROVISIONER_WORK_NOTIFICATION_TOKEN_KEY@@"
