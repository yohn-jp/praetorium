en]{display:none!important}@media(max-width:760px){.specimen-bar{padding:10px 12px;gap:8px;align-items:flex-start}.specimen-bar p{max-width:185px;font-size:10px}.specimen-switch button{padding:6px 9px;font-size:11px}.app{margin-top:0;border-left:0;border-right:0}.app[data-ui=mobile]{margin-top:0}.main{padding:24px 16px}.header{padding:0 16px}.list-head,.repo-row{grid-template-columns:minmax(140px,1.6fr) 90px 80px;gap:12px}.permission,.operation,.list-head .col-access,.list-head .col-operation{display:none}.detail-grid,.form-layout{grid-template-columns:1fr}.detail-head{display:block}.detail-actions{margin-top:16px}.comparison{grid-template-columns:1fr}.revision+.revision{border-left:0;border-top:1px solid var(--line)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<div class="specimen-bar"><div><strong>Design specimen / V1</strong><p>Synthetic data. No API calls or deployment actions.</p></div><div class="specimen-switch" aria-label="Specimen interface"><button data-mode="desktop">Desktop</button><button data-mode="mobile">Mobile</button></div></div>
<div id="app" class="app"></div>
<p class="prototype-note">Visual reference for docs/design/COMMERCIAL-UI-V1.md · not the production portal.</p>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const mode = params.get('ui') === 'mobile' ? 'mobile' : 'desktop';
const screen = ['detail','configuration','activity','empty'].includes(params.get('screen')) ? params.get('screen') : 'list';
const selected = ['novel','notes','drafts','archive'].includes(params.get('repo')) ? params.get('repo') : 'novel';
const fixtures = [
 {id:'novel',canConfigure:true,name:'the-winter-atlas',state:'ready',label:'Ready',access:'Admin',operation:'Deployment complete',reason:'Current deployment is serving requests.'},
 {id:'notes',canConfigure:true,name:'field-notes',state:'blocked',label:'Blocked',access:'Maintain',operation:'No operation',reason:'Choose an approved configuration before starting.'},
 {id:'drafts',canConfigure:false,name:'collected-essays',state:'starting',label:'Starting',access:'Write',operation:'Start in progress',reason:'Waiting for the runtime to report ready.'},
 {id:'archive',canConfigure:false,name:'archived-chapters',state:'stopped',label:'Stopped',access:'Read',operation:'Stop complete',reason:'Open the application to request a start.'}
];
const repo = fixtures.find(r => r.id === selected);
const state = r => `<span class="status ${r.state}"><span class="state-dot" aria-hidden="true"></span>${r.label}</span>`;
function href(target, id=selected, ui=mode) {const q=new URLSearchParams({ui,screen:target,repo:id});return '?'+q.toString();}
const repoIcon = '<span class="repo-icon" aria-hidden="true">▤</span>';
function header() {return `<header class="header"><a class="brand" href="${href('list')}"><span class="mark" aria-hidden="true">P</span>Praetorium</a>${mode==='desktop'?'<span class="primary-nav">Repositories</span>':''}<div class="header-right">${mode==='desktop'?'<span class="connection"><i class="dot"></i>GitHub connected</span>':''}<span class="account" aria-label="Example account">EX</span></div></header>${mode==='mobile'?'<div class="mobile-connection"><span class="connection"><i class="dot"></i>GitHub connected</span><span>Example workspace</span></div>':''}`;}
function list() {const empty=screen==='empty';const intro=`<div class="page-head"><div><h1>Repositories <span class="count">${empty?'0':'4'}</span></h1><p>Your applications, configurations and runtime state.</p></div>${mode==='desktop'?'<span class="subtle">Example workspace</span>':''}</div>`;
const rows=fixtures.map(r=>mode==='desktop'?`<div class="repo-row" role="listitem"><div class="repo-identity">${repoIcon}<div><a class="repo-name" href="${href('detail',r.id)}">${r.name}</a><span class="repo-owner">example / ${r.name}</span></div></div>${state(r)}<span class="permission">${r.access}</span><span class="operation">${r.operation}</span><a class="row-action" href="${href('detail',r.id)}">Details <span aria-hidden="true">→</span></a></div>`:`<li class="mobile-record"><div class="repo-identity">${repoIcon}<div><a class="repo-name" href="${href('detail',r.id)}">${r.name}</a><span class="repo-owner">example / ${r.name}</span></div></div><div class="mobile-record-meta">${state(r)}<span class="subtle">${r.access} access</span></div><p>${r.reason}</p><a class="mobile-row-action" href="${href('detail',r.id)}">${r.state==='blocked'?'Review configuration':'Repository details'}<span aria-hidden="true">→</span></a></li>`).join('');
return intro+`<div class="list-surface">${empty?'<div class="empty"><h2>No repositories available</h2><p>This account has no repositories available through the installed Praetorium App.</p><a href="'+href('list')+'">Return to populated specimen</a></div>':mode==='desktop'?'<div class="list-head" aria-hidden="true"><span>Repository</span><span>Runtime</span><span class="col-access">Your access</span><span class="col-operation">Latest operation</span><span></span></div><div role="list" aria-label="Repositories">'+rows+'</div>':'<ul class="mobile-records" aria-label="Repositories">'+rows+'</ul>'}</div><div class="caption"><span>Repository access follows your current GitHub permissions.</span><span><a href="${href(empty?'list':'empty')}">${empty?'Populated state':'View empty state'}</a></span></div>`;}
function tabs() {return `<nav class="section-tabs" aria-label="Repository sections">${[['detail','Overview'],['configuration','Configuration'],['activity','Activity']].map(([id,label])=>`<button data-destination="${id}" aria-current="${screen===id?'page':'false'}">${label}</button>`).join('')}</nav>`;}
function detailHeader() {return `<div class="breadcrumb"><a href="${href('list')}">Repositories</a><span aria-hidden="true">/</span><span>${repo.name}</span></div><div class="page-head detail-head"><div><span class="repo-owner">example /</span><h1>${repo.name}</h1><div class="state-line">${state(repo)}<span>${repo.access} access</span><span>App installed</span></div></div><div class="detail-actions">${repo.state==='blocked'?`<a class="button-link primary" href="${href('configuration')}">Choose configuration</a>`:`<button disabled title="Specimen only; no runtime action">${repo.state==='stopped'?'Start application':repo.state==='starting'?'Check application':'Open application'}</button>`}${repo.canConfigure&&repo.state!=='blocked'?`<a class="row-action" href="${href('configuration')}">Configure</a>`:''}</div></div>`;}

const tags = ids => `<div class="tag-list">${ids.map(id=>`<span class="tag">${id}</span>`).join('')}</div>`;
function revision(title) {if(repo.state==='blocked')return `<section class="revision"><h3>${title}</h3><div class="revision-title">Not configured</div><p>No approved deployment has been selected.</p><dl class="facts"><div><dt>Composed image</dt><dd>Not built</dd></div></dl></section>`;return `<section class="revision"><h3>${title}</h3><div class="revision-title">Scriptorium 0.2.0</div><p>Approved base release · example</p><dl class="facts"><div><dt>Release policy</dt><dd>Follow stable releases</dd></div><div><dt>Requested modules</dt><dd>${tags(['Story','Publishing'])}</dd></div><div><dt>Included modules</dt><dd>${tags(['Story','Publishing'])}</dd></div><div><dt>Resource allocation</dt><dd>0.50 vCPU · 512 MiB</dd></div></dl><details><summary>Exact artifact identifiers</summary><p class="mono">Illustrative identifiers omitted. Production shows the service-supplied full digests.</p></details></section>`;}
function overview(){return (repo.state==='blocked'?`<div class="alert"><div><div class="alert-title">Configuration required</div><p>No application is starting yet. Choose an approved release and resource profile, then preview the configuration.</p></div></div>`:'')+`<div class="detail-grid"><div class="surface"><div class="surface-heading"><h2>Deployment</h2><span class="subtle">Current and desired</span></div>${repo.state==='blocked'?'<div class="unconfigured"><dl><div><dt>Current deployment</dt><dd>Not configured</dd></div><div><dt>Desired deployment</dt><dd>Not configured</dd></div></dl><p>No composed image is available.</p></div>':'<div class="comparison">'+revision('Current deployment')+revision('Desired deployment')+'</div>'}</div><aside><section class="surface"><h2>Latest operation</h2><div class="activity-event"><span class="activity-dot ${repo.state==='ready'?'':'is-neutral'}" aria-hidden="true"></span><div><strong>${repo.operation}</strong><p>${repo.reason}</p></div></div>${repo.state==='blocked'?'':`<a href="${href('activity')}" class="row-action">View activity →</a>`}</section><div class="helper-note"><b>Current and desired are separate.</b><br>A requested configuration does not replace the current deployment until it is accepted and running.</div></aside></div>`;}

function configuration(){if(!repo.canConfigure)return `<div class="surface"><div class="form-section"><h2>Configuration is read-only</h2><p>Ask a repository maintainer or administrator to change the approved configuration.</p></div></div>`;return `<p class="sample-status">Visual fixture only. These selections do not run the producer resolver or submit a build.</p><div id="preview-message" class="preview-notice" hidden role="status"></div><div class="form-layout"><form id="config-form" class="surface"><section class="form-section"><h2>Desired configuration</h2><p>Choose an approved release and resource allocation.</p><div class="field-grid"><label class="field">Release policy<select name="releasePolicy"><option value="stable">Follow stable releases</option><option value="pinned">Pin an approved release</option></select></label><label class="field">Approved base release<select name="releaseId"><option>Scriptorium 0.2.0 — example</option></select></label></div></section><section class="form-section"><h2>Requested modules</h2><p>Select what the application needs. Required dependencies appear in the authoritative preview.</p><div class="module-options">${['Story','Publishing','MCP','Diagnostics'].map((name,i)=>`<label class="module-option"><input type="checkbox" name="moduleIds" value="${name.toLowerCase()}"${i<2?' checked':''}><span>${name}</span></label>`).join('')}</div></section><section class="form-section"><h2>Resources</h2><label class="field">Resource profile<select name="resourceProfileId"><option value="small">Small — example profile</option></select></label></section><div class="form-actions"><button type="button" id="preview">Preview selection</button><button disabled title="No backend is connected">Save configuration and build</button></div></form><aside><section class="surface"><h2>Before saving</h2><p>Preview the actual dependency closure and resource allocation before submitting a configuration.</p><p>Only the service determines support, permissions and operator limits.</p><span class="status unknown">Specimen · not evaluated</span></section></aside></div>`;}
function activity(){return `<div class="surface"><div class="surface-heading"><h2>Repository activity</h2><span class="subtle">Example events</span></div><div class="operation-list"><article class="operation-item"><div class="operation-item-header"><h3>${repo.operation}</h3>${state(repo)}</div><p>${repo.reason}</p><details><summary>Operation details</summary><p>Production retains the original operation ID, result, error and permitted retry action.</p></details></article></div></div>`;}
const app=document.getElementById('app');app.dataset.ui=mode;app.innerHTML=header()+`<main id="main-content" class="main">${screen==='list'||screen==='empty'?list():detailHeader()+tabs()+(screen==='configuration'?configuration():screen==='activity'?activity():overview())}</main>`;
let dirty=false;document.getElementById('config-form')?.addEventListener('change',()=>{dirty=true;});
function navigate(url){if(dirty&&!confirm('Discard the unsaved specimen selections?'))return;dirty=false;location.href=url;}
document.querySelectorAll('[data-mode]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.mode===mode));button.addEventListener('click',()=>navigate(href(screen,selected,button.dataset.mode)));});
document.querySelectorAll('[data-destination]').forEach(button=>button.addEventListener('click',()=>navigate(href(button.dataset.destination))));
document.querySelectorAll('#app a').forEach(link=>link.addEventListener('click',event=>{if(dirty&&!confirm('Discard the unsaved specimen selections?'))event.preventDefault();else dirty=false;}));
document.getElementById('preview')?.addEventListener('click',()=>{const selectedModules=[...document.querySelectorAll('input[name="moduleIds"]:checked')].map(el=>el.value);const message=document.getElementById('preview-message');message.textContent='Specimen selection: '+(selectedModules.join(', ')||'no optional modules')+'. No dependency, capacity or security validation has been performed.';message.hidden=false;});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
</script>
</body>
</html>
