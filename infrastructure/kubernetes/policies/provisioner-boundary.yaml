apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: praetorium-provisioner-instance-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: dedicated-provisioner-identity
      expression: >-
        request.userInfo.username ==
        "system:serviceaccount:praetorium-system:praetorium-provisioner"
  validations:
    - expression: request.operation != "DELETE"
      message: The Provisioner may not delete per-instance namespaces.
    - expression: >-
        request.operation == "DELETE" || (
          object.metadata.name.startsWith("praetorium-instances-") &&
          object.metadata.labels["arcadia.io/instance-id"].matches("^ins_[0-9A-HJKMNP-TV-Z]{26}$") &&
          object.metadata.name == "praetorium-instances-" +
            object.metadata.labels["arcadia.io/instance-id"].substring(4).lowerAscii() &&
          object.metadata.labels["arcadia.io/platform"] == "arcadia-platform" &&
          object.metadata.labels["app.kubernetes.io/managed-by"] == "arcadia-provisioner" &&
          object.metadata.labels["praetorium.io/repository-id"].matches("^[1-9][0-9]*$") &&
          int(object.metadata.labels["praetorium.io/repository-id"]) <= 9007199254740991 &&
          object.metadata.labels["arcadia.io/ownership-version"] == "v1" &&
          object.metadata.labels["arcadia.io/runtime-cluster-id"] == "@@CLUSTER_ID@@" &&
          object.metadata.labels["pod-security.kubernetes.io/enforce"] == "restricted" &&
          object.metadata.labels["pod-security.kubernetes.io/audit"] == "restricted" &&
          object.metadata.labels["pod-security.kubernetes.io/warn"] == "restricted" &&
          (!("pod-security.kubernetes.io/enforce-version" in object.metadata.labels) ||
            object.metadata.labels["pod-security.kubernetes.io/enforce-version"] == "latest") &&
          (!("pod-security.kubernetes.io/audit-version" in object.metadata.labels) ||
            object.metadata.labels["pod-security.kubernetes.io/audit-version"] == "latest") &&
          (!("pod-security.kubernetes.io/warn-version" in object.metadata.labels) ||
            object.metadata.labels["pod-security.kubernetes.io/warn-version"] == "latest")
        )
      message: The Provisioner may create or update only a namespace owned by this cluster and one valid instance identity.
    - expression: >-
        request.operation != "UPDATE" || (
          oldObject.metadata.name == object.metadata.name &&
          oldObject.metadata.labels["arcadia.io/platform"] == object.metadata.labels["arcadia.io/platform"] &&
          oldObject.metadata.labels["app.kubernetes.io/managed-by"] == object.metadata.labels["app.kubernetes.io/managed-by"] &&
          oldObject.metadata.labels["arcadia.io/instance-id"] == object.metadata.labels["arcadia.io/instance-id"] &&
          oldObject.metadata.labels["praetorium.io/repository-id"] == object.metadata.labels["praetorium.io/repository-id"] &&
          oldObject.metadata.labels["arcadia.io/ownership-version"] == object.metadata.labels["arcadia.io/ownership-version"] &&
          oldObject.metadata.labels["arcadia.io/runtime-cluster-id"] == object.metadata.labels["arcadia.io/runtime-cluster-id"] &&
          oldObject.metadata.labels["pod-security.kubernetes.io/enforce"] == "restricted" &&
          oldObject.metadata.labels["pod-security.kubernetes.io/audit"] == "restricted" &&
          oldObject.metadata.labels["pod-security.kubernetes.io/warn"] == "restricted" &&
          oldObject.metadata.labels["pod-security.kubernetes.io/enforce"] == object.metadata.labels["pod-security.kubernetes.io/enforce"] &&
          oldObject.metadata.labels["pod-security.kubernetes.io/audit"] == object.metadata.labels["pod-security.kubernetes.io/audit"] &&
          oldObject.metadata.labels["pod-security.kubernetes.io/warn"] == object.metadata.labels["pod-security.kubernetes.io/warn"] &&
          (!("pod-security.kubernetes.io/enforce-version" in oldObject.metadata.labels) ||
            oldObject.metadata.labels["pod-security.kubernetes.io/enforce-version"] == "latest") &&
          (!("pod-security.kubernetes.io/audit-version" in oldObject.metadata.labels) ||
            oldObject.metadata.labels["pod-security.kubernetes.io/audit-version"] == "latest") &&
          (!("pod-security.kubernetes.io/warn-version" in oldObject.metadata.labels) ||
            oldObject.metadata.labels["pod-security.kubernetes.io/warn-version"] == "latest") &&
          (("pod-security.kubernetes.io/enforce-version" in oldObject.metadata.labels) ==
            ("pod-security.kubernetes.io/enforce-version" in object.metadata.labels)) &&
          (("pod-security.kubernetes.io/audit-version" in oldObject.metadata.labels) ==
            ("pod-security.kubernetes.io/audit-version" in object.metadata.labels)) &&
          (("pod-security.kubernetes.io/warn-version" in oldObject.metadata.labels) ==
            ("pod-security.kubernetes.io/warn-version" in object.metadata.labels)) &&
          (!("pod-security.kubernetes.io/enforce-version" in oldObject.metadata.labels) ||
            oldObject.metadata.labels["pod-security.kubernetes.io/enforce-version"] ==
              object.metadata.labels["pod-security.kubernetes.io/enforce-version"]) &&
          (!("pod-security.kubernetes.io/audit-version" in oldObject.metadata.labels) ||
            oldObject.metadata.labels["pod-security.kubernetes.io/audit-version"] ==
              object.metadata.labels["pod-security.kubernetes.io/audit-version"]) &&
          (!("pod-security.kubernetes.io/warn-version" in oldObject.metadata.labels) ||
            oldObject.metadata.labels["pod-security.kubernetes.io/warn-version"] ==
              object.metadata.labels["pod-security.kubernetes.io/warn-version"])
