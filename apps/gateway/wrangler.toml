name = "praetorium-gateway"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "USER_AUTH_STATE"
class_name = "UserAuthStateDurableObject"

[[durable_objects.bindings]]
name = "EPHEMERAL_CODES"
class_name = "EphemeralCodeDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserAuthStateDurableObject", "EphemeralCodeDurableObject"]

[[kv_namespaces]]
binding = "GATEWAY_KV"
id = "770c4ac60df74b019409c1203f35687d"
preview_id = "770c4ac60df74b019409c1203f35687d"

# Account-wide unique IDs. Verify namespace ownership before any Cloudflare
# deployment; previews must use a distinct GATEWAY_ENVIRONMENT key prefix.
# Each binding is a location-local, best-effort counter; none writes to KV.
[[ratelimits]]
name = "LOGIN_RATE_LIMIT"
namespace_id = "761101"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "MCP_SOURCE_RATE_LIMIT"
namespace_id = "761102"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "MCP_CREDENTIAL_RATE_LIMIT"
namespace_id = "761103"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RUNTIME_GIT_RATE_LIMIT"
namespace_id = "761104"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "WAKE_RATE_LIMIT"
namespace_id = "761105"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "MUTATION_RECEIPT_RATE_LIMIT"
namespace_id = "761106"
[ratelimits.simple]
limit = 10
period = 60

[[services]]
binding = "CONTROL_PLANE"
service = "praetorium-control-plane"

# Runtime secrets and environment-specific non-secret values are supplied
# by the deployment environment. The Worker validates all required bindings
# and values before serving routes.

[[routes]]
pattern = "praetorium.yohn.jp"
custom_domain = true

[[routes]]
pattern = "admin.praetorium.yohn.jp"
custom_domain = true

[vars]
GATEWAY_ENVIRONMENT = "production"
GATEWAY_ORIGIN = "https://praetorium.yohn.jp"
PRAETORIUM_ADMIN_ORIGIN = "https://admin.praetorium.yohn.jp"
PRAETORIUM_ADMIN_GITHUB_USER_IDS = "213253858"
# Explicit trusted service source and producer adapter registry; never user-controlled URLs.
PRAETORIUM_RELEASE_SOURCES_JSON = '[{"id":"scriptorium","label":"Scriptorium","githubRepository":"yohn-jp/scriptorium","adapter":"scriptorium-v1"}]'
CONTROL_PLANE_ORIGIN = "https://control.praetorium.yohn.jp"
GATEWAY_SESSION_TTL_SECONDS = "28800"
GATEWAY_HANDOFF_TTL_SECONDS = "60"
GATEWAY_ACCESS_GRANT_TTL_SECONDS = "300"
GATEWAY_INSTANCE_HOSTNAME_SUFFIX = "instances.praetorium.yohn.jp"
GATEWAY_ALLOWED_REPOSITORY_OWNER = "yohn-jp"
GITHUB_APP_ID = "5355765"
GITHUB_OAUTH_CLIENT_ID = "Iv23liUxWil9dmhuYJuA"
GATEWAY_TOKEN_ENCRYPTION_KEY_ID = "initial"
