name: Publish Praetorium service images

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main commit to verify and publish
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: praetorium-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Install and verify monorepo
        run: |
          corepack enable
          corepack pnpm@11.18.0 install --frozen-lockfile
          corepack pnpm@11.18.0 check
          node --test tests/deployment/reproducibility.test.mjs
      - name: Run real Gateway Chromium UI acceptance
        if: github.event_name == 'pull_request'
        run: |
          corepack pnpm@11.18.0 exec playwright install --with-deps chromium
          PRAETORIUM_UI_BROWSERS=chromium node tests/e2e/commercial-ui.test.mjs
      - name: Export SSR HTML for this PR
        if: github.event_name == 'pull_request'
        run: node scripts/export-commercial-ui-html.mjs
      - name: Attach SSR HTML preview for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: praetorium-evidence-ledger-rendered
          path: .praetorium-preview/*.html
          include-hidden-files: true
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: provisioner
            package: '@praetorium/provisioner'
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: instance-access
            package: '@praetorium/instance-access'
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: build-worker
            package: '@praetorium/build-worker'
            dockerfile: infrastructure/docker/build-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Select immutable publication reference
        id: publication
        env:
          TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ && "$EXPECTED_REVISION" == "$GITHUB_SHA" ]] ||
              { echo "Requested revision differs from the checked-out main commit" >&2; exit 1; }
            echo "tag=source-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
              { echo "Invalid semver tag" >&2; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish pinned service
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: |
            ghcr.io/yohn-jp/praetorium/${{ matrix.service }}:${{ steps.publication.outputs.tag }}
          build-args: |
            NODE_BUILD_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            NODE_RUNTIME_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            BUILDKIT_CLIENT_IMAGE=docker.io/moby/buildkit@sha256:c1d0a1bc930a427f99f72220d1b263d6986d4592b21507fbc7f8bf7ecdaed004
            BUILDKIT_CLIENT_BUILDCTL_PATH=/usr/bin/buildctl
            PRAETORIUM_BUILDKIT_BUILDCTL_PATH=/usr/local/bin/buildctl
            SERVICE_PACKAGE=${{ matrix.package }}
      - name: Record digest for deployment inventory
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "ghcr.io/yohn-jp/praetorium/$SERVICE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
