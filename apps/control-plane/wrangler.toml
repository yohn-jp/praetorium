name = "praetorium-control-plane"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Preserve existing remote policy variables not yet declared in this config.
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[[services]]
binding = "GATEWAY_SERVICE"
service = "praetorium-gateway"

[[d1_databases]]
binding = "CONTROL_PLANE_DB"
database_name = "praetorium-platform"
database_id = "08f29fef-eb9e-4541-82fb-777fa2f4aab0"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "REPOSITORY_COORDINATOR"
class_name = "RepositoryCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepositoryCoordinator"]

[[routes]]
pattern = "control.praetorium.yohn.jp"
custom_domain = true

[vars]
GATEWAY_ORIGIN = "https://praetorium.yohn.jp"
CONTROL_PLANE_ORIGIN = "https://control.praetorium.yohn.jp"
INSTANCE_HOST_SUFFIX = "instances.praetorium.yohn.jp"
PROVISIONER_CLUSTER_ID = "clu_01M552J5HCXXJAPCCPN480JSJN"
PROVISIONER_WORKER_ID = "clu_01M552J5HCXXJAPCCPN480JSJN-provisioner"
BUILD_WORKER_ID = "clu_01M552J5HCXXJAPCCPN480JSJN-build-worker"
RUNTIME_REGISTRY_HOST = "ghcr.io"
GIT_CREDENTIAL_BROKER_LOCATOR = "https://praetorium.yohn.jp/internal/github/credential"
