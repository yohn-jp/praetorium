apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: praetorium-local-self-signed
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: praetorium-instance-origin
  namespace: praetorium-system
spec:
  secretName: "@@TLS_SECRET_NAME@@"
  issuerRef:
    name: praetorium-local-self-signed
    kind: ClusterIssuer
  dnsNames:
    - "@@INSTANCE_HOSTNAME_SUFFIX@@"
    - "*.@@INSTANCE_HOSTNAME_SUFFIX@@"
