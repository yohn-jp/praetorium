---
praetorium_host_identity: "{{ inventory_hostname }}"
praetorium_common_packages:
  - ca-certificates
  - curl
  - jq

# Replace these example SSH settings in an operator-owned inventory. Never
# store private keys, notification tokens, or tunnel tokens in this repository.
ansible_user: operator
ansible_ssh_private_key_file: /path/to/operator/ssh-key
