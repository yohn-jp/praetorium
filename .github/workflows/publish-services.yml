name: Verify Praetorium service images (disposable)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: praetorium-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - name: Install and verify monorepo
        run: |
          corepack enable
          corepack pnpm@11.18.0 install --frozen-lockfile
          corepack pnpm@11.18.0 check
          node --test tests/deployment/reproducibility.test.mjs
          node --test tests/deployment/headlamp-admin.test.mjs
          node --test tests/deployment/deployment-order.test.mjs tests/deployment/migrations.test.mjs tests/deployment/worker-projection.test.mjs
          node --test tests/deployment/service-image-publication.test.mjs
          node --test tests/deployment/actions-verification.test.mjs
          node --test tests/deployment/fixture-process.test.mjs
          node --check scripts/deployment-migrations.mjs scripts/deployment-plan.mjs
          node --check scripts/deploy-cloudflare.mjs scripts/deploy-platform.mjs scripts/deploy-k3s.mjs
          node --check scripts/service-image-publication.mjs
          node --check scripts/ci/source-stable-fixture.mjs
          node scripts/ci/verify-workerd-runtime-identity.mjs

      - name: Install disposable Chromium for operator console verification
        run: corepack pnpm@11.18.0 exec playwright install --with-deps chromium
      - name: Render and exercise desktop and mobile operator diagnostics
        env:
          PRAETORIUM_OPERATOR_EVIDENCE_DIR: ${{ runner.temp }}/operator-console-diagnostics
        run: node --test tests/e2e/operator-console-diagnostics.test.mjs
      - name: Exercise independent Admin Worker browser and protected infrastructure API
        env:
          PRAETORIUM_UI_EVIDENCE_DIR: ${{ runner.temp }}/operator-console-diagnostics/independent-admin
        run: node --test tests/e2e/independent-admin.test.mjs
      - name: Verify Gateway module discovery and MCP guidance in Chromium
        env:
          PRAETORIUM_UI_BROWSERS: chromium
          PRAETORIUM_UI_EVIDENCE_DIR: ${{ runner.temp }}/operator-console-diagnostics/gateway
        run: node tests/e2e/commercial-ui.test.mjs
      - name: Upload synthetic operator console browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/operator-console-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  source-stable-fixture:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - name: Build workspace packages for the isolated Source to Stable fixture
        run: |
          corepack enable
          corepack pnpm@11.18.0 install --frozen-lockfile
          corepack pnpm@11.18.0 build
      - name: Verify built fixture imports
        run: node scripts/ci/source-stable-fixture.mjs --check-imports
      - name: Exercise v0.3.5 Metadata, real BuildKit failure evidence, guarded Retry and Stable CAS
        env:
          NODE_ENV: test
          PRAETORIUM_SOURCE_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/praetorium-source-stable-evidence
        run: node scripts/ci/source-stable-fixture.mjs
      - name: Upload bounded Source fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-stable-fixture-evidence
          path: |
            ${{ runner.temp }}/praetorium-source-stable-evidence/source-stable-fixture-result.json
            ${{ runner.temp }}/praetorium-source-stable-evidence/buildkitd.log
          if-no-files-found: warn
          retention-days: 7

  candidate-images:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: provisioner
            package: "@praetorium/provisioner"
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: instance-access
            package: "@praetorium/instance-access"
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: build-worker
            package: "@praetorium/build-worker"
            dockerfile: infrastructure/docker/build-worker.Dockerfile
          - service: coordination
            package: "@praetorium/coordination"
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
          - service: observer
            package: "@praetorium/observer"
            dockerfile: infrastructure/docker/service-runtime.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build real service image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: praetorium-ci/${{ matrix.service }}:${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=service-${{ matrix.service }}
          cache-to: type=gha,scope=service-${{ matrix.service }},mode=max
          build-args: |
            NODE_BUILD_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            NODE_RUNTIME_IMAGE=docker.io/library/node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            BUILDKIT_CLIENT_IMAGE=docker.io/moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
            BUILDKIT_CLIENT_BUILDCTL_PATH=/usr/bin/buildctl
            PRAETORIUM_BUILDKIT_BUILDCTL_PATH=/usr/local/bin/buildctl
            SERVICE_PACKAGE=${{ matrix.package }}
      - name: Assert image exists locally
        run: docker image inspect "praetorium-ci/${{ matrix.service }}:${{ github.event.pull_request.head.sha || github.sha }}" >/dev/null

  kubernetes-admission:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - name: Build real tenant resource renderer
        run: |
          corepack enable
          corepack pnpm@11.18.0 install --frozen-lockfile
          corepack pnpm@11.18.0 --filter '@praetorium/kubernetes...' build
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: praetorium-ci
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Validate dynamic Runtime objects against the disposable Kubernetes API
        run: |
          node scripts/ci/render-runtime-admission.mjs > /tmp/praetorium-runtime.json
          RUNTIME_NAMESPACE=$(node -e 'const x=require("/tmp/praetorium-runtime.json"); const names=[...new Set(x.items.map(v=>v.metadata.namespace))]; if(names.length!==1 || !/^praetorium-ci-[a-z0-9-]+$/.test(names[0]))process.exit(1); console.log(names[0]);')
          kubectl create namespace "$RUNTIME_NAMESPACE"
          kubectl label namespace "$RUNTIME_NAMESPACE" \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/warn=restricted \
            --overwrite
          kubectl apply --dry-run=server --validate=strict -f /tmp/praetorium-runtime.json
      - name: Render and validate the exact Headlamp HelmRelease values
        run: |
          helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
          awk '/^  values:/{v=1;next} v{sub(/^    /,"");print}' \
            infrastructure/kubernetes/addons/headlamp/helm-release.yaml > /tmp/headlamp-values.yaml
          helm template praetorium-headlamp headlamp/headlamp \
            --version 0.45.0 --namespace praetorium-admin \
            --values /tmp/headlamp-values.yaml > /tmp/headlamp.yaml
          kubectl create namespace praetorium-admin
          kubectl apply --dry-run=server --validate=strict -f /tmp/headlamp.yaml
