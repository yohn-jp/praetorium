apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetorium-provisioner
  namespace: praetorium-system
  labels:
    app.kubernetes.io/name: provisioner
    app.kubernetes.io/part-of: praetorium
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praetorium-instance-access-config
  namespace: praetorium-system
data:
  INSTANCE_ACCESS_PORT: "8080"
  INSTANCE_ACCESS_INSTANCE_HOSTNAME_SUFFIX: "@@INSTANCE_HOSTNAME_SUFFIX@@"
  GATEWAY_ORIGIN: "@@GATEWAY_ORIGIN@@"
  GATEWAY_URL: "@@GATEWAY_SERVICE_URL@@"
  NODE_ENV: "@@NODE_ENV@@"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praetorium-instance-access
  namespace: praetorium-system
  labels:
    app.kubernetes.io/name: instance-access
    app.kubernetes.io/part-of: praetorium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: instance-access
  template:
    metadata:
      labels:
        app.kubernetes.io/name: instance-access
        app.kubernetes.io/part-of: praetorium
    spec:
      serviceAccountName: praetorium-instance-access
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: "@@SECRET_APPLICATION_IMAGE_PULL@@"
      containers:
        - name: instance-access
          image: "@@IMAGE_INSTANCE_ACCESS@@"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server.js"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: praetorium-instance-access-config
          env:
            - name: INSTANCE_ACCESS_SERVICE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "@@SECRET_INSTANCE_ACCESS_AUTH@@"
                  key: "@@SECRET_INSTANCE_ACCESS_AUTH_KEY@@"
                  optional: false
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: instance-access
  namespace: praetorium-system
  labels:
    app.kubernetes.io/name: instance-access
    app.kubernetes.io/part-of: praetorium
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: instance-access
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praetorium-provisioner-config
  namespace: praetorium-system
data:
  PROVISIONER_CONTROL_PLANE_URL: "@@CONTROL_PLANE_URL@@"
  PROVISIONER_NAMESPACE_PREFIX: praetorium-instances
  PROVISIONER_INSTANCE_HOSTNAME_SUFFIX: "@@INSTANCE_HOSTNAME_SUFFIX@@"
  PROVISIONER_CONTROL_NAMESPACE: praetorium-system
  PROVISIONER_CONTROL_SERVICE: provisioner
  PROVISIONER_CLUSTER_ID: "@@CLUSTER_ID@@"
  PROVISIONER_WORKER_ID: "@@PROVISIONER_WORKER_ID@@"
  PROVISIONER_CREDENTIAL_PATH: /var/run/secrets/control-plane/credential
  PROVISIONER_IMAGE_PULL_CONFIG_PATH: /var/run/secrets/application-image-pull/config.json
  PROVISIONER_INGRESS_NAMESPACE: traefik
  PROVISIONER_INSTANCE_ACCESS_NAMESPACE: praetorium-system
  PROVISIONER_INSTANCE_ACCESS_SERVICE: instance-access
  PROVISIONER_MAX_CPU_MILLI: "@@PROVISIONER_MAX_CPU_MILLI@@"
  PROVISIONER_MAX_MEMORY_MIB: "@@PROVISIONER_MAX_MEMORY_MIB@@"
  PROVISIONER_MAX_EPHEMERAL_STORAGE_MIB: "@@PROVISIONER_MAX_EPHEMERAL_STORAGE_MIB@@"
  PROVISIONER_MAX_CAPACITY_AGE_MS: "30000"
  PROVISIONER_HEALTH_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praetorium-provisioner
  namespace: praetorium-system
  labels:
    app.kubernetes.io/name: provisioner
    app.kubernetes.io/part-of: praetorium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provisioner
        app.kubernetes.io/part-of: praetorium
    spec:
      serviceAccountName: praetorium-provisioner
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: "@@SECRET_APPLICATION_IMAGE_PULL@@"
      containers:
        - name: provisioner
          image: "@@IMAGE_PROVISIONER@@"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: praetorium-provisioner-config
          volumeMounts:
            - name: control-plane-credential
              mountPath: /var/run/secrets/control-plane
              readOnly: true
            - name: application-image-pull
              mountPath: /var/run/secrets/application-image-pull
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: control-plane-credential
          secret:
            secretName: "@@SECRET_PROVISIONER_CREDENTIAL@@"
            defaultMode: 0440
            items:
              - key: "@@SECRET_PROVISIONER_CREDENTIAL_KEY@@"
                path: credential
        - name: application-image-pull
          secret:
            secretName: "@@SECRET_APPLICATION_IMAGE_PULL@@"
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
---
apiVersion: v1
kind: Service
metadata:
  name: praetorium-provisioner
  namespace: praetorium-system
  labels:
    app.kubernetes.io/name: provisioner
    app.kubernetes.io/part-of: praetorium
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: provisioner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetorium-instance-access
  namespace: praetorium-system
  labels:
    app.kubernetes.io/name: instance-access
    app.kubernetes.io/part-of: praetorium
automountServiceAccountToken: false
