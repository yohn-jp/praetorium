apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetorium-build-worker
  namespace: praetorium-build
  labels:
    app.kubernetes.io/name: build-worker
    app.kubernetes.io/part-of: praetorium
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praetorium-build-worker-config
  namespace: praetorium-build
data:
  PRAETORIUM_BUILD_WORKER_ID: "@@BUILD_WORKER_ID@@"
  PRAETORIUM_CONTROL_PLANE_URL: "@@BUILD_WORKER_CONTROL_PLANE_URL@@"
  PRAETORIUM_BUILD_SERVICE_TOKEN_FILE: /var/run/praetorium-build-worker/private/control-plane/token
  PRAETORIUM_BUILD_SIGNING_KEY_FILE: /var/run/praetorium-build-worker/private/signing/key.pem
  PRAETORIUM_BUILD_SIGNING_KEY_ID: "@@BUILD_WORKER_SIGNING_KEY_ID@@"
  PRAETORIUM_BUILD_COMPOSITION_REPOSITORY: "@@BUILD_WORKER_COMPOSITION_REPOSITORY@@"
  PRAETORIUM_BUILD_REGISTRY_URL: "@@BUILD_REGISTRY_URL@@"
  PRAETORIUM_BUILD_MAX_IMAGE_LAYER_BYTES: "@@BUILD_MAX_IMAGE_LAYER_BYTES@@"
  PRAETORIUM_BUILD_MAX_IMAGE_VERIFICATION_MS: "@@BUILD_MAX_IMAGE_VERIFICATION_MS@@"
  PRAETORIUM_BUILD_MAX_REGISTRY_REQUEST_MS: "@@BUILD_MAX_REGISTRY_REQUEST_MS@@"
  PRAETORIUM_BUILDKIT_ADDRESS: "@@BUILDKIT_ENDPOINT@@"
  PRAETORIUM_BUILDKIT_TLS_SERVER_NAME: "@@BUILDKIT_SERVER_NAME@@"
  PRAETORIUM_BUILDKIT_TLS_CA_FILE: /var/run/praetorium-build-worker/private/buildkit/ca.crt
  PRAETORIUM_BUILDKIT_TLS_CERT_FILE: /var/run/praetorium-build-worker/private/buildkit/tls.crt
  PRAETORIUM_BUILDKIT_TLS_KEY_FILE: /var/run/praetorium-build-worker/private/buildkit/tls.key
  PRAETORIUM_BUILDKIT_BUILDCTL_PATH: "@@BUILD_WORKER_BUILDKIT_PATH@@"
  PRAETORIUM_BUILDKIT_FRONTEND_REPOSITORY: "@@BUILDKIT_FRONTEND_REPOSITORY@@"
  PRAETORIUM_BUILDKIT_OUTPUT_REPOSITORY: "@@BUILDKIT_OUTPUT_REPOSITORY@@"
  PRAETORIUM_BUILDKIT_DOCKER_CONFIG_DIRECTORY: /var/run/praetorium-build-worker/private/registry
  PRAETORIUM_BUILDKIT_TEMPORARY_DIRECTORY: /tmp/praetorium-build-worker/private
  PRAETORIUM_BUILDKIT_SAFE_PATH: /usr/local/bin:/usr/bin:/bin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praetorium-build-worker
  namespace: praetorium-build
  labels:
    app.kubernetes.io/name: build-worker
    app.kubernetes.io/part-of: praetorium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: build-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: build-worker
        app.kubernetes.io/part-of: praetorium
    spec:
      serviceAccountName: praetorium-build-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: "@@SECRET_APPLICATION_IMAGE_PULL@@"
      initContainers:
        - name: prepare-runtime-secrets
          image: "@@IMAGE_BUILD_WORKER@@"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/prepare-runtime-secrets.js"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 1Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 16Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: buildkit-client
              mountPath: /var/run/secrets/buildkit
              readOnly: true
            - name: registry-push
              mountPath: /var/run/secrets/registry
              readOnly: true
            - name: registry-pull
              mountPath: /var/run/secrets/registry-pull
              readOnly: true
            - name: control-plane-auth
              mountPath: /var/run/secrets/control-plane
              readOnly: true
            - name: build-signing-key
              mountPath: /var/run/secrets/signing
              readOnly: true
            - name: runtime-private
              mountPath: /var/run/praetorium-build-worker
            - name: worker-temporary
              mountPath: /tmp/praetorium-build-worker
      containers:
        - name: build-worker
          image: "@@IMAGE_BUILD_WORKER@@"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main.js"]
          envFrom:
            - configMapRef:
                name: praetorium-build-worker-config
          env:
            - name: PRAETORIUM_BUILD_REGISTRY_PULL_CREDENTIAL_FILE
              value: /var/run/praetorium-build-worker/private/registry-pull/credential.json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-private
              mountPath: /var/run/praetorium-build-worker
              readOnly: true
            - name: worker-temporary
              mountPath: /tmp/praetorium-build-worker
      volumes:
        - name: buildkit-client
          secret:
            secretName: "@@SECRET_BUILDKIT_CLIENT@@"
            defaultMode: 0440
            items:
              - key: "@@SECRET_BUILDKIT_CA_KEY@@"
                path: ca.crt
              - key: "@@SECRET_BUILDKIT_CERT_KEY@@"
                path: tls.crt
              - key: "@@SECRET_BUILDKIT_PRIVATE_KEY@@"
                path: tls.key
        - name: registry-push
          secret:
            secretName: "@@SECRET_REGISTRY_PUSH@@"
            defaultMode: 0440
            items:
              - key: "@@SECRET_REGISTRY_PUSH_KEY@@"
                path: config.json
        - name: registry-pull
          secret:
            secretName: "@@SECRET_REGISTRY_PULL@@"
            defaultMode: 0440
            items:
              - key: "@@SECRET_REGISTRY_PULL_KEY@@"
                path: credential.json
        - name: control-plane-auth
          secret:
            secretName: "@@SECRET_BUILD_WORKER_AUTH@@"
            defaultMode: 0440
            items:
              - key: "@@SECRET_BUILD_WORKER_AUTH_KEY@@"
                path: token
        - name: build-signing-key
          secret:
            secretName: "@@SECRET_BUILD_WORKER_SIGNING_KEY@@"
            defaultMode: 0440
            items:
              - key: "@@SECRET_BUILD_WORKER_SIGNING_KEY_KEY@@"
                path: key.pem
        - name: worker-temporary
          emptyDir:
            sizeLimit: 2Gi
        - name: runtime-private
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
