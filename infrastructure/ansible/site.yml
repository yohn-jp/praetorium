---
- name: Converge common host prerequisites
  hosts: praetorium
  become: true
  roles:
    - common
    - telemetry

- name: Configure Management host services
  hosts: management
  become: true
  roles:
    - management
    - coordination
    - observer

- name: Configure Runtime host membership
  hosts: runtime
  become: true
  roles:
    - runtime

- name: Audit existing Builder host
  hosts: builder
  become: true
  roles:
    - builder
