---
coordination_enabled: false
coordination_tunnel_enabled: false
coordination_service_user: praetorium-coordination
coordination_service_uid: 2001
coordination_service_group: praetorium-coordination
coordination_service_home: /var/lib/praetorium/coordination
coordination_subid_start: 1000000
coordination_subid_size: 65536
coordination_ubuntu_archive_mirror: https://archive.ubuntu.com/ubuntu
coordination_podman_package_version: ""
coordination_cloudflared_package_version: ""
coordination_cloudflare_key_url: https://pkg.cloudflare.com/cloudflare-main.gpg
coordination_cloudflare_package_repository: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
coordination_image: ""
coordination_container_uid: 1000
coordination_container_gid: 1000
coordination_memory_limit: 256m
coordination_cpu_limit: "0.5"
coordination_pids_limit: 128
coordination_provisioner_notification_url: ""
coordination_build_notification_url: ""
coordination_provisioner_token_src: ""
coordination_build_token_src: ""
coordination_provisioner_token_path: /var/lib/praetorium/credentials/coordination/provisioner.token
coordination_build_token_path: /var/lib/praetorium/credentials/coordination/build-worker.token
coordination_provisioner_token_container_path: /run/secrets/provisioner.token
coordination_build_token_container_path: /run/secrets/build-worker.token
coordination_downstream_hosts: []
coordination_tunnel_id: ""
coordination_vpc_service_id: ""
coordination_tunnel_token_src: ""
coordination_tunnel_token_path: /var/lib/praetorium/credentials/coordination-tunnel.token
coordination_tunnel_origin: http://127.0.0.1:8789
coordination_user_unit_dir: /etc/containers/systemd/users
coordination_cloudflared_binary: /usr/bin/cloudflared
coordination_cloudflared_unit: praetorium-coordination-tunnel.service
coordination_quadlet_marker_path: /etc/praetorium/coordination-quadlet.json
coordination_tunnel_unit_marker_path: /etc/praetorium/coordination-tunnel-unit.json
