apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: praetorium-acme
spec:
  acme:
    email: "@@ACME_CONTACT_EMAIL@@"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: praetorium-acme-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: "@@SECRET_CLOUDFLARE_DNS_TOKEN@@"
              key: "@@SECRET_CLOUDFLARE_DNS_TOKEN_KEY@@"
        selector:
          dnsZones:
            - "yohn.jp"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: praetorium-instance-origin
  namespace: praetorium-system
spec:
  secretName: "@@TLS_SECRET_NAME@@"
  issuerRef:
    name: praetorium-acme
    kind: ClusterIssuer
  dnsNames:
    - "@@INSTANCE_HOSTNAME_SUFFIX@@"
    - "*.@@INSTANCE_HOSTNAME_SUFFIX@@"
    - "*.scriptorium.yohn.jp"
