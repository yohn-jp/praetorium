apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: praetorium-provisioner-tenant-networkpolicy
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
  matchConditions:
    - name: provisioner-runtime-writer
      expression: request.userInfo.username == "system:serviceaccount:praetorium-system:praetorium-provisioner"
  validations:
    - expression: >-
        object.metadata.namespace == namespaceObject.metadata.name &&
        object.metadata.namespace == "praetorium-instances-" + object.metadata.labels["arcadia.io/instance-id"].substring(4).lowerAscii() &&
        namespaceObject.metadata.labels["arcadia.io/platform"] == "arcadia-platform" &&
        namespaceObject.metadata.labels["app.kubernetes.io/managed-by"] == "arcadia-provisioner" &&
        namespaceObject.metadata.labels["arcadia.io/instance-id"] == object.metadata.labels["arcadia.io/instance-id"] &&
        namespaceObject.metadata.labels["praetorium.io/repository-id"] == object.metadata.labels["praetorium.io/repository-id"] &&
        namespaceObject.metadata.labels["arcadia.io/ownership-version"] == "v1" &&
        namespaceObject.metadata.labels["arcadia.io/runtime-cluster-id"] == "@@CLUSTER_ID@@" &&
        namespaceObject.metadata.labels["kubernetes.io/metadata.name"] == namespaceObject.metadata.name &&
        object.metadata.name == "arcadia-ins-" + object.metadata.labels["arcadia.io/instance-id"].substring(4).lowerAscii() + "-network" &&
        object.metadata.labels.size() == 10 &&
        object.metadata.labels["arcadia.io/platform"] == "arcadia-platform" &&
        object.metadata.labels["app.kubernetes.io/managed-by"] == "arcadia-provisioner" &&
        object.metadata.labels["arcadia.io/instance-id"].matches("^ins_[0-9A-HJKMNP-TV-Z]{26}$") &&
        object.metadata.labels["praetorium.io/repository-id"].matches("^[1-9][0-9]*$") &&
        object.metadata.labels["praetorium.io/runtime-epoch"].matches("^[1-9][0-9]*$") &&
        object.metadata.labels["arcadia.io/generation"].matches("^[1-9][0-9]*$") &&
        (object.metadata.labels["arcadia.io/release-id"] == "none" ||
          object.metadata.labels["arcadia.io/release-id"].matches("^[A-Za-z0-9](?:[A-Za-z0-9_.-]{0,61}[A-Za-z0-9])?$")) &&
        object.metadata.labels["arcadia.io/ownership-version"] == "v1" &&
        object.metadata.labels["arcadia.io/runtime-cluster-id"] == "@@CLUSTER_ID@@" &&
        object.metadata.labels["app.kubernetes.io/name"] == "scriptorium"
      message: NetworkPolicies must belong to the provisioner's exact tenant namespace and runtime identity.
    # CEL exposes spec/peer/port/selector as typed structs, not maps. Check
    # their optional fields explicitly; size() is for maps and lists only.
    - expression: >-
        has(object.spec.podSelector) && has(object.spec.ingress) &&
        has(object.spec.egress) && has(object.spec.policyTypes) &&
        (!has(object.spec.podSelector.matchExpressions) || object.spec.podSelector.matchExpressions.size() == 0) &&
        object.spec.podSelector.matchLabels.size() == 2 &&
        object.spec.podSelector.matchLabels["arcadia.io/instance-id"] == object.metadata.labels["arcadia.io/instance-id"] &&
        object.spec.podSelector.matchLabels["app.kubernetes.io/name"] == "scriptorium" &&
        object.spec.policyTypes == ["Ingress", "Egress"] &&
        object.spec.ingress.size() == 3 &&
        object.spec.ingress.all(rule,
          has(rule.from) && has(rule.ports) && rule.from.size() == 1 && rule.ports.size() == 1 &&
          !has(rule.ports[0].endPort) && rule.ports[0].protocol == "TCP" &&
          has(rule.ports[0].port) && type(rule.ports[0].port) == int &&
          rule.ports[0].port >= 1 && rule.ports[0].port <= 65535 &&
          rule.ports[0].port == object.spec.ingress[0].ports[0].port
        ) &&
        !has(object.spec.ingress[0].from[0].ipBlock) &&
        (!has(object.spec.ingress[0].from[0].namespaceSelector.matchExpressions) || object.spec.ingress[0].from[0].namespaceSelector.matchExpressions.size() == 0) &&
        object.spec.ingress[0].from[0].namespaceSelector.matchLabels.size() == 1 &&
        object.spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"] == "traefik" &&
        (!has(object.spec.ingress[0].from[0].podSelector.matchExpressions) || object.spec.ingress[0].from[0].podSelector.matchExpressions.size() == 0) &&
        object.spec.ingress[0].from[0].podSelector.matchLabels.size() == 1 &&
        object.spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"] == "traefik" &&
        !has(object.spec.ingress[1].from[0].ipBlock) &&
        (!has(object.spec.ingress[1].from[0].namespaceSelector.matchExpressions) || object.spec.ingress[1].from[0].namespaceSelector.matchExpressions.size() == 0) &&
        object.spec.ingress[1].from[0].namespaceSelector.matchLabels.size() == 1 &&
        object.spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"] == "praetorium-system" &&
        (!has(object.spec.ingress[1].from[0].podSelector.matchExpressions) || object.spec.ingress[1].from[0].podSelector.matchExpressions.size() == 0) &&
        object.spec.ingress[1].from[0].podSelector.matchLabels.size() == 1 &&
        object.spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"] == "instance-access" &&
        !has(object.spec.ingress[2].from[0].ipBlock) &&
        (!has(object.spec.ingress[2].from[0].namespaceSelector.matchExpressions) || object.spec.ingress[2].from[0].namespaceSelector.matchExpressions.size() == 0) &&
        object.spec.ingress[2].from[0].namespaceSelector.matchLabels.size() == 1 &&
        object.spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"] == "praetorium-system" &&
        (!has(object.spec.ingress[2].from[0].podSelector.matchExpressions) || object.spec.ingress[2].from[0].podSelector.matchExpressions.size() == 0) &&
        object.spec.ingress[2].from[0].podSelector.matchLabels.size() == 1 &&
        object.spec.ingress[2].from[0].podSelector.matchLabels["app.kubernetes.io/name"] == "provisioner" &&
        object.spec.egress.size() == 2 &&
        has(object.spec.egress[0].to) && has(object.spec.egress[0].ports) &&
        object.spec.egress[0].to.size() == 1 &&
        !has(object.spec.egress[0].to[0].ipBlock) &&
        (!has(object.spec.egress[0].to[0].namespaceSelector.matchExpressions) || object.spec.egress[0].to[0].namespaceSelector.matchExpressions.size() == 0) &&
        object.spec.egress[0].to[0].namespaceSelector.matchLabels.size() == 1 &&
        object.spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"] == "kube-system" &&
        (!has(object.spec.egress[0].to[0].podSelector.matchExpressions) || object.spec.egress[0].to[0].podSelector.matchExpressions.size() == 0) &&
        object.spec.egress[0].to[0].podSelector.matchLabels.size() == 1 &&
        object.spec.egress[0].to[0].podSelector.matchLabels["k8s-app"] == "kube-dns" &&
        object.spec.egress[0].ports.size() == 2 &&
        !has(object.spec.egress[0].ports[0].endPort) &&
        object.spec.egress[0].ports[0].protocol == "UDP" &&
        object.spec.egress[0].ports[0].port == 53 &&
        !has(object.spec.egress[0].ports[1].endPort) &&
        object.spec.egress[0].ports[1].protocol == "TCP" &&
        object.spec.egress[0].ports[1].port == 53 &&
        has(object.spec.egress[1].to) && has(object.spec.egress[1].ports) &&
        object.spec.egress[1].to.size() == 2 &&
        object.spec.egress[1].to.all(peer, has(peer.ipBlock) && !has(peer.podSelector) && !has(peer.namespaceSelector)) &&
        object.spec.egress[1].to[0].ipBlock.cidr == "0.0.0.0/0" &&
        object.spec.egress[1].to[0].ipBlock.except == ["10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8", "169.254.0.0/16", "172.16.0.0/12", "192.0.0.0/24", "192.168.0.0/16", "168.63.129.16/32", "198.18.0.0/15", "224.0.0.0/4", "240.0.0.0/4"] &&
        object.spec.egress[1].to[1].ipBlock.cidr == "::/0" &&
        object.spec.egress[1].to[1].ipBlock.except == ["::/128", "::1/128", "::/96", "::fffe:0:0/95", "2001:db8::/32", "fc00::/7", "fec0::/10", "fe80::/10", "ff00::/8"] &&
        object.spec.egress[1].ports.size() == 1 &&
        !has(object.spec.egress[1].ports[0].endPort) &&
        object.spec.egress[1].ports[0].protocol == "TCP" &&
        object.spec.egress[1].ports[0].port == 443
      message: Tenant NetworkPolicies must preserve the exact three ingress peers, bounded listener, DNS, and public HTTPS egress.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: praetorium-provisioner-tenant-networkpolicy
spec:
  policyName: praetorium-provisioner-tenant-networkpolicy
  validationActions: [Deny]
