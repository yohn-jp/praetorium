name = "praetorium-admin"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[[services]]
binding = "ADMIN_IDENTITY"
service = "praetorium-gateway"
entrypoint = "AdminIdentityBroker"

[[services]]
binding = "CONTROL_PLANE"
service = "praetorium-control-plane"

[[routes]]
pattern = "admin.praetorium.yohn.jp"
custom_domain = true

[vars]
ADMIN_ORIGIN = "https://admin.praetorium.yohn.jp"
GATEWAY_ORIGIN = "https://praetorium.yohn.jp"

# ADMIN_CONTROL_PLANE_AUTH is an independently provisioned secret.
# INFRASTRUCTURE VPC binding is only added after the read-only Observer is deployed.
